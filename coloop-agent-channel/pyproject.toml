[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coloop-agent-channel"
version = "0.1.0"
description = "远程控制模块，支持多渠道与 AI Agent 交互"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/channel"]

[project.scripts]
channel = "channel.cli.app:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
